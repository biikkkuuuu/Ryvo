name: music_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  google_fonts: ^6.3.1
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  http: ^1.5.0
  ytmusicapi_dart: ^2.3.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  youtube_explode_dart: ^2.5.1
  encrypt: ^5.0.3
  html_unescape: ^2.0.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  audio_service: ^0.18.19
  url_launcher: ^6.3.2
  firebase_remote_config: ^6.6.0
  package_info_plus: ^10.2.1
  # NEW: Offline Download Packages
  dio: ^5.4.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/ryvo_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/ryvo_icon.png"
  adaptive_icon_background: "#121212" 
  adaptive_icon_foreground: "assets/icon/ryvo_icon.png"